name: render-video-test

on:
  workflow_dispatch:

jobs:
  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure Google Chrome
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            curl -sSL -o /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update -qq
            sudo apt-get install -y /tmp/chrome.deb
          fi
          google-chrome --version
          which google-chrome

      - name: Install dependencies
        run: npm ci

      - name: Render BridgeTest video (30 frames, quarter scale)
        run: |
          npx remotion render src/index.ts BridgeTest out/bridgetest.mp4 --scale=0.25 --browser-executable=$(which google-chrome) --gl=swangle --chromium-flags='{\"enable-unsafe-swiftshader\":true}' --timeout=300000 --props='{\"post\":{\"composer\":false}}'
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: bridgetest
          path: out/bridgetest.mp4
