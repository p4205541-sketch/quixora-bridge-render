name: render-split

# Frame-split parallel render: splits a composition into N frame ranges,
# renders each range on its own runner (matrix), then stitches the chunks
# back into one video. Reusable via workflow_dispatch inputs.
#
# Proven recipe: Node 22, npm ci, preinstalled google-chrome, SwiftShader
# via --gl=swangle + --enable-unsafe-swiftshader, EffectComposer bypassed
# via --props post.composer=false (composer draws nothing under SwiftShader).

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Remotion composition name"
        required: true
        default: "BridgeShort"
        type: string
      total_frames:
        description: "Total frames in the composition"
        required: true
        default: "2025"
        type: string
      start_frame:
        description: "First frame to render (0 = from the start; use to re-render one shot range only)"
        required: false
        default: "0"
        type: string
      chunks:
        description: "Number of parallel chunks to split into"
        required: true
        default: "10"
        type: string

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.chunks.outputs.matrix }}
    steps:
      - id: chunks
        env:
          TOTAL_FRAMES: ${{ inputs.total_frames }}
          START_FRAME: ${{ inputs.start_frame }}
          CHUNKS: ${{ inputs.chunks }}
        run: |
          MATRIX_JSON=$(python3 - <<'PYEOF'
          import json, math, os
          total = int(os.environ['TOTAL_FRAMES'])
          start0 = int(os.environ.get('START_FRAME') or 0)
          n = int(os.environ['CHUNKS'])
          size = math.ceil(total / n)
          chunks = []
          for i in range(n):
              start = start0 + i * size
              end = min(start0 + (i + 1) * size, start0 + total) - 1
              if start > end:
                  break
              chunks.append({'index': i, 'frames': f'{start}-{end}'})
          # sanity: contiguous coverage, exact total, no gaps/overlaps
          covered = sum(int(c['frames'].split('-')[1]) - int(c['frames'].split('-')[0]) + 1 for c in chunks)
          assert covered == total, f'coverage {covered} != total {total}'
          assert chunks[0]['frames'].startswith(f'{start0}-'), 'first chunk must start at start_frame'
          assert chunks[-1]['frames'].endswith(f'-{start0 + total - 1}'), 'last chunk must end at start_frame+total-1'
          print(json.dumps(chunks))
          PYEOF
          )
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"
          echo "Chunks: $MATRIX_JSON"

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure Google Chrome
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            curl -sSL -o /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update -qq
            sudo apt-get install -y /tmp/chrome.deb
          fi
          google-chrome --version
          which google-chrome

      - name: Install dependencies
        run: npm ci

      - name: Render chunk ${{ matrix.chunk.index }} (frames ${{ matrix.chunk.frames }})
        run: |
          npx remotion render src/index.ts ${{ inputs.composition }} out/chunk-${{ matrix.chunk.index }}.mp4 --frames=${{ matrix.chunk.frames }} --scale=1.0 --browser-executable=$(which google-chrome) --gl=swangle --chromium-flags='{"enable-unsafe-swiftshader":true}' --timeout=300000 --props='{"post":{"composer":false}}'
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk.index }}
          path: out/chunk-${{ matrix.chunk.index }}.mp4

  stitch:
    needs: [plan, render]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install ffmpeg (static build)
        # NOTE: ffmpeg is NOT preinstalled on the runner. apt-get install
        # hung 9+ min (slow mirror/lock), and the johnvansickle static
        # download stalled 7+ min from the runner. Primary source is the
        # BtbN static build served from GitHub's own CDN (fast from
        # runners); johnvansickle is the fallback. Layout-agnostic: the
        # ffmpeg binary is located with find after extraction.
        run: |
          if ! curl -sSL --max-time 120 --retry 2 -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz; then
            echo "BtbN download failed, trying johnvansickle mirror"
            curl -sSL --max-time 180 --retry 1 -o /tmp/ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          fi
          mkdir -p /tmp/ffmpeg-static
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-static --strip-components=1
          FFBIN=$(dirname "$(find /tmp/ffmpeg-static -name ffmpeg -type f | head -1)")
          echo "ffmpeg dir: $FFBIN"
          echo "$FFBIN" >> "$GITHUB_PATH"
          "$FFBIN/ffmpeg" -version | head -1
          "$FFBIN/ffprobe" -version | head -1

      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: chunks

      - name: Stitch chunks and verify frame count
        env:
          TOTAL_FRAMES: ${{ inputs.total_frames }}
          CHUNKS: ${{ inputs.chunks }}
        run: |
          python3 - <<'PYEOF'
          import os
          n = int(os.environ['CHUNKS'])
          with open('list.txt', 'w') as f:
              for i in range(n):
                  p = f'chunks/chunk-{i}/chunk-{i}.mp4'
                  assert os.path.exists(p), f'missing chunk file: {p}'
                  f.write(f"file '{os.path.abspath(p)}'\n")
          print(open('list.txt').read())
          PYEOF
          count_frames() {
            ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of csv=p=0 stitched.mp4
          }
          if ffmpeg -y -f concat -safe 0 -i list.txt -c copy stitched.mp4 2>concat-copy.log; then
            echo "stream-copy concat OK"
          else
            echo "stream-copy concat failed, will re-encode"
            cat concat-copy.log
            rm -f stitched.mp4
          fi
          if [ -f stitched.mp4 ]; then
            COUNT=$(count_frames)
          else
            COUNT=0
          fi
          echo "frames after copy-concat: $COUNT (expected $TOTAL_FRAMES)"
          if [ "$COUNT" != "$TOTAL_FRAMES" ]; then
            echo "frame count mismatch, re-encoding..."
            ffmpeg -y -f concat -safe 0 -i list.txt -c:v libx264 -crf 16 -pix_fmt yuv420p stitched.mp4
            COUNT=$(count_frames)
            echo "frames after re-encode: $COUNT (expected $TOTAL_FRAMES)"
          fi
          if [ "$COUNT" != "$TOTAL_FRAMES" ]; then
            echo "::error::frame count $COUNT != expected $TOTAL_FRAMES"
            exit 1
          fi
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,avg_frame_rate -of default=noprint_wrappers=1 stitched.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 stitched.mp4
          ls -la stitched.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: stitched-video
          path: stitched.mp4
