name: Render Beauty + Depth + Composite

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Remotion composition to render"
        required: true
        default: "BridgeShort"
        type: string
      frames:
        description: "Identical frame range for both passes (e.g. 0-2024)"
        required: true
        default: "0-2024"
        type: string
      scale:
        description: "Render scale"
        required: true
        default: "1"
        type: string
      focus:
        description: "Depth value at the focus plane (0..1) — measured ~0.95 for foreground-character shots"
        required: true
        default: "0.95"
        type: string
      blur:
        description: "Maximum background blur radius (0..22)"
        required: true
        default: "18"
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        pass: [beauty, depth]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure Google Chrome
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            curl -sSL --retry 2 -o /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update -qq
            sudo apt-get install -y /tmp/chrome.deb
          fi
          google-chrome --version

      - name: Install dependencies
        run: npm ci

      - name: Render ${{ matrix.pass }} pass
        env:
          COMPOSITION: ${{ inputs.composition }}
          FRAMES: ${{ inputs.frames }}
          SCALE: ${{ inputs.scale }}
          PASS: ${{ matrix.pass }}
        run: |
          mkdir -p out
          if [ "$PASS" = "depth" ]; then
            PROPS='{"post":{"depth":true,"composer":false}}'
            # Low CRF keeps the grayscale depth ramp smooth and avoids excessive banding.
            npx remotion render src/index.ts "$COMPOSITION" out/depth.mp4 \
              --frames="$FRAMES" --scale="$SCALE" --crf=8 \
              --browser-executable="$(which google-chrome)" --gl=swangle \
              --chromium-flags='{"enable-unsafe-swiftshader":true}' \
              --timeout=300000 --props="$PROPS"
          else
            PROPS='{"post":{"composer":false}}'
            npx remotion render src/index.ts "$COMPOSITION" out/beauty.mp4 \
              --frames="$FRAMES" --scale="$SCALE" \
              --browser-executable="$(which google-chrome)" --gl=swangle \
              --chromium-flags='{"enable-unsafe-swiftshader":true}' \
              --timeout=300000 --props="$PROPS"
          fi
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ matrix.pass }}-pass
          path: out/${{ matrix.pass }}.mp4
          if-no-files-found: error
          retention-days: 3

  composite:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg (static build)
        # NOTE: ffmpeg is NOT preinstalled on the runner. apt-get install
        # hung 9+ min (slow mirror/lock), and the johnvansickle static
        # download stalled 7+ min from the runner. Primary source is the
        # BtbN static build served from GitHub's own CDN (fast from
        # runners); johnvansickle is the fallback. Layout-agnostic: the
        # ffmpeg binary is located with find after extraction.
        # (Copied from render-split.yml's stitch job — the proven install.)
        run: |
          if ! curl -sSL --max-time 120 --retry 2 -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz; then
            echo "BtbN download failed, trying johnvansickle mirror"
            curl -sSL --max-time 180 --retry 1 -o /tmp/ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          fi
          mkdir -p /tmp/ffmpeg-static
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-static --strip-components=1
          FFBIN=$(dirname "$(find /tmp/ffmpeg-static -name ffmpeg -type f | head -1)")
          echo "ffmpeg dir: $FFBIN"
          echo "$FFBIN" >> "$GITHUB_PATH"
          "$FFBIN/ffmpeg" -version | head -1
          "$FFBIN/ffprobe" -version | head -1

      - name: Install depth compositor dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-depth.txt
          ffmpeg -version | head -1

      - uses: actions/download-artifact@v4
        with:
          pattern: bridge-*-pass
          path: passes
          merge-multiple: true

      - name: Verify and composite depth of field
        run: |
          ls -lh passes/
          python scripts/depth_pass_composite.py \
            --rgb passes/beauty.mp4 \
            --depth passes/depth.mp4 \
            --output out/final-depth-look.mp4 \
            --focus ${{ inputs.focus }} --blur ${{ inputs.blur }} --bloom 0.18 \
            --warmth 0.12 --lift 0.10 --haze 0.035
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 out/final-depth-look.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: final-depth-look
          path: out/final-depth-look.mp4
          if-no-files-found: error
          retention-days: 7
