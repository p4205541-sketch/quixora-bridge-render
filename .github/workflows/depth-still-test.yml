name: Bridge Depth Still A-B Test

on:
  workflow_dispatch:
    inputs:
      frame:
        description: "Frame number to compare (200 = town aerial)"
        required: true
        default: "200"
        type: string
      scale:
        description: "Render scale"
        required: true
        default: "0.5"
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pass: [beauty, depth]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure Google Chrome
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            curl -sSL --retry 2 -o /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update -qq
            sudo apt-get install -y /tmp/chrome.deb
          fi
          google-chrome --version
      - name: Install dependencies
        run: npm ci
      - name: Render ${{ matrix.pass }} still
        env:
          FRAME: ${{ inputs.frame }}
          SCALE: ${{ inputs.scale }}
          PASS: ${{ matrix.pass }}
        run: |
          mkdir -p out
          if [ "$PASS" = "depth" ]; then
            npx remotion still src/index.ts BridgeShort out/depth-frame.png \
              --frame="$FRAME" --scale="$SCALE" \
              --browser-executable="$(which google-chrome)" --gl=swangle \
              --chromium-flags='{"enable-unsafe-swiftshader":true}' \
              --timeout=300000 --props='{"post":{"depth":true,"composer":false}}'
          else
            npx remotion still src/index.ts BridgeShort out/beauty-frame.png \
              --frame="$FRAME" --scale="$SCALE" \
              --browser-executable="$(which google-chrome)" --gl=swangle \
              --chromium-flags='{"enable-unsafe-swiftshader":true}' \
              --timeout=300000 --props='{"post":{"composer":false}}'
          fi
          ls -lh out/
      - uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ matrix.pass }}-frame-${{ inputs.frame }}
          path: out/${{ matrix.pass }}-frame.png
          if-no-files-found: error
          retention-days: 3
